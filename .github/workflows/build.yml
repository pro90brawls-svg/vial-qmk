name: Build Vial Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Firmware
        run: |
          qmk compile -kb onekey_rp2040 -km vial

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onekey_rp2040_vial
          path: |
            *.uf2
